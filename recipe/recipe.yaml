schema_version: 1

context:
  version: "0.5.0"

package:
  name: resvg-py
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/resvg-py/resvg_py-${{ version }}.tar.gz
  sha256: 6d3bf8e866b4e129524d9432a809138b2d100931d8d635bc81294002abcdfd46

build:
  number: 2
  # The extension targets the stable ABI, so one build covers every GIL-enabled
  # CPython. If a free-threading migration ever reaches this feedstock, is_abi3
  # is false there and it falls back to a per-version abi3t build.
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - crossenv
        - maturin >=1,<2
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
  host:
    - if: is_abi3
      then: python-abi3
    - python
    - pip
    - maturin >=1,<2
  run:
    - python

tests:
  - python:
      imports:
        - resvg_py
      pip_check: true
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - script:
      - python test_render.py
    files:
      recipe:
        - test_render.py
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/resvg_py/resvg_py.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%\resvg_py\resvg_py.pyd -s -v --assume-minimum-abi3 ${{ python_min }}

about:
  homepage: https://github.com/baseplate-admin/resvg-py
  summary: A safe and high level Python binding for the resvg SVG rendering library
  description: |
    resvg_py exposes the resvg SVG renderer to Python, rendering SVG documents
    to PNG bytes. It covers most of the resvg option surface, including custom
    font files and directories, style sheets, zoom and DPI, and embedded
    raster images.
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://resvg-py.readthedocs.io/
  repository: https://github.com/baseplate-admin/resvg-py

extra:
  recipe-maintainers:
    - baseplate-admin
    - serjflint
    - ewels
